
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoMarket - Contacto</title>
  <link rel="stylesheet" href="../Css/main.css">
  <link rel="stylesheet" href="../Css/layout.css">
  <link rel="stylesheet" href="../Css/components.css">
  <link rel="stylesheet" href="../Css/animations.css">
</head>
<body>

  <!-- Encabezado -->
  <header class="header">
    <div class="logo">EcoMarket</div>
    <nav class="nav">
      <a href="../index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="sobre-nosotros.html">Nosotros</a>
      <a href="contacto.html" class="active">Contacto</a>
    </nav>
    <div class="header-actions">
      <a href="#">🔍 Buscar</a>
      <a href="#">🛒 Carrito</a>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="container">
    <h1 class="section-title">Contáctanos</h1>
    <p class="contact-intro">¿Tienes dudas sobre nuestros productos ecológicos o deseas realizar un pedido al por mayor? Escríbenos.</p>

    <!-- Formulario de Contacto -->
    <section class="contact-section">
      <form class="contact-form">
        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="form-group">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
        </div>

        <button type="submit" class="btn btn-submit">Enviar Mensaje</button>
      </form>
    </section>
  </main>

  <!-- Pie de Página -->
  <footer class="footer">
    <p>&copy; 2026 EcoMarket. Todos los derechos reservados.</p>
    <div class="footer-links">
      <a href="#">Términos y Condiciones</a>
      <a href="#">Privacidad</a>
    </div>
  </footer>

</body>
</html>
